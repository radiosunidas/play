    <script>
        // 🔒 PROTECCIÓN ACTIVA
        document.addEventListener("contextmenu", e => {
            e.preventDefault();
            alert('🔒 Contenido protegido - Radios Unidas');
        });
        document.onkeydown = e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
                alert('🔒 No permitido');
                return false;
            }
        };

        // 🎵 REPRODUCTOR INTACTO
        $("#player").lunaradio({
           userinterface: "big",
           backgroundcolor: "rgba(0,17,59,1)",
           fontcolor: "#ffffff",
           hightlightcolor: "#53012e",
           fontname: "Unica One",
           googlefont: "Unica+One&display=swap",
           fontratio: "0.6",
           radioname: "RADIOS UNIDAS - PARA TODO EL MUNDO",
           scroll: "true",
           coverimage: "img/logo.png",
           onlycoverimage: "false",
           coverstyle: "animated",
           usevisualizer: "real",
           visualizertype: "2",
           itunestoken: "1000lIPN",
           streamurl: "https://stream-04.surfernetwork.com/5b3fwcx4sfvuv?",
           streamtype: "zeno",
           idzeno: "5b3fwcx4sfvuv",
           volume: "100",
           autoplay: "true",
           debug: "false",
           usestreamcorsproxy: "true"
        });

        // 📲 INSTALACIÓN PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('installPopup').style.display = 'block';
        });
        document.getElementById('installAppButton').addEventListener('click', async () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('installPopup').style.display = 'none';
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('installPopup').style.display = 'none';
        });
        function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
        if (isIOS()) {
            document.getElementById('installAppButton').style.display = 'none';
            document.getElementById('iosInstructions').style.display = 'block';
        }

        // MENÚ
        $(".mobile-nav-toggle").click(function () {
            $("body").toggleClass("mobile-nav-active");
            $(".mobile-nav-toggle i").toggleClass("fa-bars fa-times");
        });
